# The release-signing tooling's own checks: the scripts' tests (fake gh, fake Apple tools, a
# real gpg), actionlint over every workflow and action, shellcheck over every script. Nightly
# with the organization's batch (org-index docs/CI-BATCHING.md) and by hand; never per push.
name: self-test

on:
  schedule:
    - cron: "0 21 * * *"   # 23:00 Europe/Warsaw (summer time)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Script tests
        run: python -m unittest discover -s tests -v
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck actions/*/*.sh scripts/*.sh
      - name: actionlint
        if: runner.os == 'Linux'
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
